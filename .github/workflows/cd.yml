name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend Docker Build
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$DOCKERHUB_USERNAME/yj-backend:$GITHUB_SHA" -t "$DOCKERHUB_USERNAME/yj-backend:latest" ./backend
      - name: Frontend Docker Build
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker build -t "$DOCKERHUB_USERNAME/yj-frontend:$GITHUB_SHA" -t "$DOCKERHUB_USERNAME/yj-frontend:latest" ./frontend
      - name: Docker Hub Push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push "$DOCKERHUB_USERNAME/yj-backend:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/yj-backend:latest"
          docker push "$DOCKERHUB_USERNAME/yj-frontend:$GITHUB_SHA"
          docker push "$DOCKERHUB_USERNAME/yj-frontend:latest"
